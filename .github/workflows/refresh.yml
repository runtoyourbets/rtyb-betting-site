name: Refresh RTYB data and publish

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can lag a few
    # minutes under load, especially right at the top of the hour -- that's
    # normal, not a sign anything's broken.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'base_data.json'
      - 'template.html'
      - 'scripts/**'
      # Admin Save (Matchups or Results Tool) publishes to these -- rebuild
      # right away so every record (Games, Stats, Teams, team pages) reflects it.
      - 'data_admin/odds_overrides.json'
      - 'data_admin/results_overrides.json'
      - 'data_admin/odds/**'
      # Preview: a piece the admin just published goes live on this run
      - 'content/published/**'

permissions:
  contents: write

concurrency:
  group: rtyb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          # the latest main when the run starts, not the commit it was queued
          # on -- a run that waits behind another (concurrency) would
          # otherwise build on stale data and its push would be rejected
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Grading tests (a failure stops the publish)
        run: python3 -m unittest discover tests

      - name: Fetch NHL schedule and scores
        run: python3 scripts/fetch_schedule.py

      - name: Backfill NHL 2nd/3rd-period scores (this season, up to 40 games a run)
        run: python3 scripts/backfill_periods.py || echo "period backfill failed; will retry next run"

      - name: Fetch other sports' schedules and scores (ESPN, yesterday through next week)
        # A failed date is logged to data_seed/games/<sport>/failures.json and
        # retried on later runs; it never stops the NHL refresh.
        run: python3 scripts/fetch_sport_games.py daily || echo "other sports fetch failed; keeping saved games"

      - name: Starting pitchers (MLB, once a day) and tonight's confirmed NHL goalies
        run: python3 scripts/fetch_starters.py || echo "starters fetch failed; keeping saved starters"

      - name: College AP polls by week (for the rank at game time)
        run: |
          python3 scripts/fetch_rankings.py || echo "AP poll fetch failed; keeping saved polls"
          python3 scripts/fetch_rankings.py ncaab || echo "NCAAB AP poll fetch failed; keeping saved polls"

      - name: Fetch team logos (cached, idempotent -- no API key needed)
        run: python3 scripts/fetch_team_logos.py

      - name: Fetch other sports' team logos (cached; only new teams are requested)
        run: python3 scripts/fetch_sport_logos.py || echo "logo fetch failed; teams keep their color badges"

      - name: Decide whether this run is the hourly odds pull
        id: gate
        run: |
          # The Odds API bills per market returned, so the full pull (every
          # game in the next 36 hours) runs once an hour: on the run landing
          # in the first 10 minutes after the hour. Every run still does the
          # closing capture (games starting in the next 20 minutes). The
          # Cloudflare timer starts runs as workflow_dispatch, so that event
          # doesn't force the hourly pull.
          minute=$(date -u +%M)
          if [ "$minute" -lt 10 ]; then
            echo "hourly=true" >> "$GITHUB_OUTPUT"
          else
            echo "hourly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch odds for every sport (The Odds API; hourly, plus the closing capture every run)
        # Writes data_feed/oddsapi/{sport}.json, the break lines for grading
        # and the usage status; SportsGameOdds' BTTS fetcher is switched off
        # (The Odds API carries 1P BTTS). A failure keeps the saved odds.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ steps.gate.outputs.hourly }}" = "true" ]; then
            python3 scripts/fetch_odds_theoddsapi.py --hourly || echo "The Odds API fetch failed; keeping saved odds"
          else
            python3 scripts/fetch_odds_theoddsapi.py || echo "The Odds API fetch failed; keeping saved odds"
          fi

      - name: Fetch 1Q / 1H / F5 odds for the other sports (Unabated, auto-published)
        # Every run, not just hourly: the free tier has no quota, only a
        # one-request-per-5-seconds limit the script keeps to. A failure
        # keeps the last good odds instead of stopping the refresh.
        env:
          UNABATED_API_KEY: ${{ secrets.UNABATED_API_KEY }}
        run: python3 scripts/fetch_odds_unabated.py || echo "Unabated fetch failed; keeping saved odds"

      - name: Check every sportsbook link carries the partner code
        # Unabated's free API is only kept while every Gambly link we publish
        # has ?utm_campaign=rtyb -- stop before committing if one doesn't.
        run: python3 -m unittest tests.test_unabated

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Preview drafts (from 8 AM ET; the recap is switched off)
        # Claude writes each sport's Preview (and the all-sports one for the home page) once a day, as a draft
        # in content/drafts/ for someone to approve; nothing is published
        # automatically. Skipped until the ANTHROPIC_API_KEY secret is set,
        # and a failure never stops the refresh (the next run retries).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install --quiet anthropic && python3 scripts/daily_content.py || echo "daily drafts failed; will retry next run"
          else
            echo "ANTHROPIC_API_KEY not set; skipping daily drafts"
          fi

      - name: Plain hyphens, then check the finished pages
        # A dash from fetched text, the admin or a Preview draft is converted,
        # never a reason to stop the refresh (scripts/hyphens.py); this runs
        # after the drafts step so their files are converted too.
        run: |
          python3 scripts/hyphens.py
          python3 -m unittest tests.test_plain_hyphen

      - name: Commit and push if anything changed
        run: |
          git config user.name "rtyb-bot"
          git config user.email "actions@users.noreply.github.com"
          # Everything this run wrote or changed, so a new page or folder can
          # never be left out of the commit (a hand-kept list missed
          # matchups/, odds/, daily/, privacy/, terms/, sitemap.xml and
          # robots.txt, which 404'd). The checkout is fresh, so the only
          # changes are the ones this job made; .gitignore keeps the raw
          # odds caches and schedule_fresh.json out.
          git add -A
          # Every internal link on every committed page must point to a
          # committed page; a broken one fails the run before anything is
          # published (the broken links are printed above).
          python3 scripts/check_links.py --staged
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git commit -m "Auto-refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Someone pushing locally at the same moment (e.g. a manual file
          # update) can land on the remote between this commit and the push
          # below, which would otherwise fail with a plain rejection. Retry a
          # few times, rebasing onto whatever's newly on the remote each
          # time, instead of just failing the whole run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest remote and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              # both rewrote the same files (another refresh, or the Odds API
              # backfill): this run's scores and odds are the newest, so its
              # side of each conflict wins (in a rebase, "theirs" is this
              # run's commit) instead of skipping the publish
              git rebase --abort
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                echo "::warning::Could not rebase this run's commit; skipping this push (the next run catches up)."
                exit 0
              fi
            fi
            sleep 3
          done
          # Pages is set to "Deploy from a branch" (main / root) in repo
          # settings -- see README -- so pushing index.html here is what
          # actually publishes it. No separate deploy step needed.
