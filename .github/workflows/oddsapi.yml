name: The Odds API

# Manual only (Run workflow), never on a schedule. The key is the
# ODDS_API_KEY secret and is never printed or written to a file.
# - oddsapi-probe: which markets and books The Odds API has per sport
#   (scripts/oddsapi_probe.py, about 5,000 credits).
# - oddsapi-backfill: closing lines for finished games the admin and the
#   Unabated feed don't have (scripts/backfill_oddsapi.py). Resumable; it
#   commits every 30 minutes and at the end, and stops at 5h30m.
# - second-half: the same job with --second-half: past games' 2nd half lines
#   (NHL: the full game's line after the 1st) at the typical time to the
#   break. Prints its estimate first; resumable, max_credits per run.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "backfill, second-half or probe"
        type: choice
        options: [backfill, second-half, probe]
        default: backfill
      sport:
        description: "backfill: nhl, nba, ncaab, nfl, ncaaf, mlb, wnba or all"
        default: all
      season:
        description: "backfill: this, last or both"
        type: choice
        options: [this, last, both]
        default: this
      max_credits:
        description: "backfill: most credits this run may use"
        default: "400000"

permissions:
  contents: write

concurrency:
  group: rtyb-oddsapi
  cancel-in-progress: false

jobs:
  oddsapi-probe:
    if: github.event.inputs.job == 'probe'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/oddsapi_probe.py

      - name: Commit and push the results
        run: |
          git config user.name "rtyb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_feed/oddsapi/probe.json data_feed/oddsapi/usage.jsonl
          if git diff --cached --quiet; then
            echo "Nothing written."
            exit 1
          fi
          git commit -m "The Odds API probe results"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git pull --no-rebase -X ours origin main --no-edit; }
            sleep 3
          done
          exit 1

  oddsapi-backfill:
    if: github.event.inputs.job == 'backfill' || github.event.inputs.job == 'second-half'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the backfill
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORT: ${{ github.event.inputs.sport }}
          SEASON: ${{ github.event.inputs.season }}
          MAX_CREDITS: ${{ github.event.inputs.max_credits }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          echo "$SPORT" | grep -Eqx 'nhl|nba|ncaab|nfl|ncaaf|mlb|wnba|all' || { echo "unknown sport"; exit 1; }
          echo "$MAX_CREDITS" | grep -Eqx '[0-9]+' || { echo "max_credits must be a number"; exit 1; }
          git config user.name "rtyb-bot"
          git config user.email "actions@users.noreply.github.com"
          EXTRA=""
          if [ "$JOB" = "second-half" ]; then EXTRA="--second-half"; fi
          python3 scripts/backfill_oddsapi.py --sport "$SPORT" --season "$SEASON" --max-credits "$MAX_CREDITS" --commit $EXTRA
